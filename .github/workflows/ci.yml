name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the pinned releases from PyPI and the lab package
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests scripts tools

      - name: Mypy
        run: python -m mypy src

      - name: Vocabulary and typography scan
        run: python tools/scan_vocabulary.py

      - name: Tests with the coverage gate
        run: >-
          python -m pytest
          --cov=epicormic_lab
          --cov-report=term-missing
          --cov-fail-under=100
